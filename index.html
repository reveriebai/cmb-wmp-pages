      --teal: #0b766d;
      --amber: #8a5a00;
      --blue: #245a9c;
      --white: #ffffff;

    * { box-sizing: border-box; }
    body {

      background: #eef2f5;

      overflow-x: hidden;
    }
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 22px 24px 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: var(--muted);
      font-size: 13px;
    }
    main { padding: 18px 24px 28px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 6px; font-size: 22px; font-weight: 700; }

      display: grid;
      gap: 9px;
      margin: 12px 0;
    }
    .toolbar-primary {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(170px, 1fr)) minmax(240px, 1.45fr) auto;
      gap: 8px;
      align-items: center;
    }
    input[type="search"] {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      background: var(--white);
      color: var(--ink);
    }
    select, .reset-button {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      background: var(--white);
      color: var(--ink);
    }
    select { cursor: pointer; }
    .reset-button {
      width: auto;
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }
    .reset-button:hover { border-color: #aebbc6; background: #f8fafb; }
    .toolbar-footer {
      display: flex;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }
    .segments {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--white);
    }
    .segments button {
      height: 38px;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .segments button:last-child { border-right: 0; }
    .segments button.active { background: var(--red); color: var(--white); }
    .table-wrap {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
      max-height: calc(100vh - 330px);
      scrollbar-gutter: stable;
    }
    .mobile-list { display: none; }

      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .product-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .product-card-title {

      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
    }
    .product-card-tags {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
    }
    .risk-badge {

      align-items: center;
      justify-content: center;
      min-width: 30px;
      min-height: 24px;
      border: 1px solid #c8d3dc;
      border-radius: 4px;
      padding: 2px 6px;
      color: #354451;
      font-size: 12px;
      font-weight: 700;
    }
    .product-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .mobile-key-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--line);

    .mobile-field { min-width: 0; }
    .mobile-field.full { grid-column: 1 / -1; }
    .mobile-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }
    .mobile-value {
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .mobile-details {
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }
    .mobile-details summary {
      min-height: 44px;
      padding: 12px 0 8px;
      color: #354451;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;

    .mobile-details-content { padding: 2px 0 5px; }

      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 13px;

      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;

      padding: 10px 11px;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.5;

    th {

      top: 0;
      z-index: 4;
      background: #f3f6f8;
      color: #354451;
      font-weight: 650;
      text-align: left;

    tr:last-child td { border-bottom: 0; }
    .w-status { width: 94px; }
    .w-name { width: 210px; }
    .w-code { width: 105px; }
    .w-risk { width: 105px; }
    .w-highlight { width: 150px; }
    .w-date { width: 116px; }
    .w-term { width: 165px; }
    .w-benchmark { width: 190px; }
    .w-fee { width: 170px; }
    .w-range { width: 260px; }
    .w-history { width: 290px; }
    .w-link { width: 110px; }
    .sticky-status, .sticky-name {
      position: sticky;
      background: var(--white);
    }
    .sticky-status { left: 0; z-index: 3; }
    .sticky-name {
      left: 94px;
      z-index: 3;
      box-shadow: 7px 0 9px -9px rgba(22, 32, 42, 0.65);
    }
    thead .sticky-status, thead .sticky-name {
      z-index: 6;
      background: #f3f6f8;
    }
    tbody tr:hover td { background: #fafcfd; }
    tbody tr:hover .sticky-status, tbody tr:hover .sticky-name { background: #fafcfd; }

      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;

      padding-right: 4px;

      padding-top: 8px;

        </tr>
      `).join("");
      mobileCards.innerHTML = visible.map(renderMobileCard).join("");
      tableWrap.style.display = visible.length ? "block" : "none";
      mobileCards.hidden = !visible.length;
      empty.style.display = visible.length ? "none" : "block";
      resultCount.textContent = `显示 ${visible.length} / ${PRODUCTS.length} 只产品`;
    }

    populateSelect(
      managerFilter,
      [...new Set(PRODUCTS.map(row => row.manager).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-CN"))
    );
    populateSelect(
      riskFilter,
      [...new Set(PRODUCTS.map(row => row.risk).filter(Boolean))].sort((a, b) =>
        (Number(String(a).replace(/\D/g, "")) || 99) - (Number(String(b).replace(/\D/g, "")) || 99)
      )
    );

    document.querySelectorAll(".segments button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segments button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        statusFilter = button.dataset.filter;
        render();
      });
    });
    search.addEventListener("input", render);
    [managerFilter, riskFilter, sortFilter].forEach(control => {
      control.addEventListener("change", render);
    });
    resetFilters.addEventListener("click", () => {
      search.value = "";
      managerFilter.value = "";
      riskFilter.value = "";
      sortFilter.value = "default";
      statusFilter = "all";
      document.querySelectorAll(".segments button").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === "all");
      });
      render();
    });
    render();
  </script>
</body>
</html>
