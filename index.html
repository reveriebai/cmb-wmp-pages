<html lang="zh-CN">

  <style>
    :root {

      --line: #d9e1e8;
      --panel: #f7f9fb;
      --red: #a81732;
      --teal: #0b766d;
      --amber: #8a5a00;
      --blue: #245a9c;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: #eef2f5;
      letter-spacing: 0;
      overflow-x: hidden;
    }
    header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 22px 24px 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: var(--muted);
      font-size: 13px;
    }
    main { padding: 18px 24px 28px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { margin-top: 6px; font-size: 22px; font-weight: 700; }
    .toolbar {
      display: grid;
      gap: 9px;
      margin: 12px 0;
    }
    .toolbar-primary {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(170px, 1fr)) minmax(240px, 1.45fr) auto;
      gap: 8px;
      align-items: center;
    }
    input[type="search"] {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      background: var(--white);
      color: var(--ink);
    }
    select, .reset-button {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      background: var(--white);
      color: var(--ink);
    }
    select { cursor: pointer; }
    .reset-button {
      width: auto;
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }
    .reset-button:hover { border-color: #aebbc6; background: #f8fafb; }
    .toolbar-footer {
      display: flex;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }
    .segments {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--white);
    }
    .segments button {
      height: 38px;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--white);
      color: var(--ink);
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .segments button:last-child { border-right: 0; }
    .segments button.active { background: var(--red); color: var(--white); }
    .table-wrap {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
      max-height: calc(100vh - 330px);
      scrollbar-gutter: stable;
    }
    .mobile-list { display: none; }
    .product-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .product-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .product-card-title {
      min-width: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
    }
    .product-card-tags {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
    }
    .risk-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      min-height: 24px;
      border: 1px solid #c8d3dc;
      border-radius: 4px;
      padding: 2px 6px;
      color: #354451;
      font-size: 12px;
      font-weight: 700;
    }
    .product-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .mobile-key-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 14px;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
    }
    .mobile-field { min-width: 0; }
    .mobile-field.full { grid-column: 1 / -1; }
    .mobile-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }
    .mobile-value {
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .mobile-details {
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }
    .mobile-details summary {
      min-height: 44px;
      padding: 12px 0 8px;
      color: #354451;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mobile-details-content { padding: 2px 0 5px; }
    .mobile-details-content .mobile-field + .mobile-field { margin-top: 10px; }
    .product-card-actions {
      display: flex;
      gap: 18px;
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    table {
      width: 100%;
      min-width: 1940px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 10px 11px;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.5;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: #f3f6f8;
      color: #354451;
      font-weight: 650;
      text-align: left;
    }
    td:last-child, th:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }
    .w-status { width: 94px; }
    .w-name { width: 210px; }
    .w-code { width: 105px; }
    .w-risk { width: 105px; }
    .w-highlight { width: 150px; }
    .w-date { width: 116px; }
    .w-term { width: 165px; }
    .w-benchmark { width: 190px; }
    .w-fee { width: 170px; }
    .w-range { width: 260px; }
    .w-history { width: 290px; }
    .w-link { width: 110px; }
    .sticky-status, .sticky-name {
      position: sticky;
      background: var(--white);
    }
    .sticky-status { left: 0; z-index: 3; }
    .sticky-name {
      left: 94px;
      z-index: 3;
      box-shadow: 7px 0 9px -9px rgba(22, 32, 42, 0.65);
    }
    thead .sticky-status, thead .sticky-name {
      z-index: 6;
      background: #f3f6f8;
    }
    tbody tr:hover td { background: #fafcfd; }
    tbody tr:hover .sticky-status, tbody tr:hover .sticky-name { background: #fafcfd; }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .pill.future { background: #fff0d6; color: var(--amber); }
    .pill.active { background: #e5f5f3; color: var(--teal); }
    .muted { color: var(--muted); font-size: 12px; }
    .scroll-cell {
      max-height: 150px;
      overflow: auto;
      padding-right: 4px;
      word-break: break-word;
    }
    .history-item + .history-item {
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid #e6ebef;
    }
    .history-method {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 650;

    .history-method.official { background: #e5f5f3; color: var(--teal); }

    .history-links { margin-left: 6px; white-space: nowrap; }
    a { color: var(--blue); text-decoration: none; font-weight: 600; }

      .table-wrap { display: none !important; }
      .mobile-list { display: grid; gap: 10px; }
      .toolbar-footer { justify-content: flex-start; }

      )
    );

    document.querySelectorAll(".segments button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segments button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        statusFilter = button.dataset.filter;
        render();
      });
    });
    search.addEventListener("input", render);
    [managerFilter, riskFilter, sortFilter].forEach(control => {
      control.addEventListener("change", render);
    });
    resetFilters.addEventListener("click", () => {
      search.value = "";
      managerFilter.value = "";
      riskFilter.value = "";
      sortFilter.value = "default";
      statusFilter = "all";
      document.querySelectorAll(".segments button").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === "all");
      });
      render();
    });
    render();
  </script>
</body>
</html>
